<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyChatApp</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #111b21; color: #e9edef; height: 100vh; overflow: hidden; }

    /* Auth Screens */
    #auth-screen { max-width: 380px; margin: 60px auto; padding: 25px; background: #202c33; border-radius: 12px; }
    .input-box { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #2a3942; background: #111b21; color: white; border-radius: 8px; font-size: 15px; outline: none; }
    .btn-green { width: 100%; padding: 12px; background: #00a884; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 15px; }
    .btn-outline { width: 100%; padding: 10px; background: transparent; border: 1px solid #00a884; color: #00a884; border-radius: 8px; cursor: pointer; margin-top: 8px; font-weight: bold; }

    /* Dashboard */
    #main-app { display: none; height: 100vh; flex-direction: column; }
    .top-nav { background: #202c33; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a3942; }
    .user-tag { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .my-dp { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: #00a884; }

    .chats-container { flex: 1; overflow-y: auto; }
    .chat-row { display: flex; align-items: center; padding: 14px 16px; border-bottom: 1px solid #202c33; cursor: pointer; }
    .chat-row:hover { background: #202c33; }
    .chat-dp { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; margin-right: 14px; background: #2a3942; display: flex; align-items: center; justify-content: center; font-weight: bold; }

    /* Floating Add Contact Button */
    .fab-btn { position: fixed; bottom: 25px; right: 25px; width: 56px; height: 56px; background: #00a884; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 26px; color: white; border: none; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }

    /* Confidential Chat Room */
    #chat-panel { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 50; flex-direction: column; background: #0b141a; }
    .chat-header { background: #202c33; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; }
    .messages-area { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; background-size: cover; background-position: center; }
    .bubble { max-width: 75%; padding: 8px 12px; border-radius: 8px; font-size: 14px; word-wrap: break-word; }
    .bubble.outgoing { background: #005c4b; align-self: flex-end; color: white; }
    .bubble.incoming { background: #202c33; align-self: flex-start; color: white; }

    .footer-bar { background: #202c33; padding: 8px 12px; display: flex; align-items: center; gap: 8px; }
    .footer-bar input { flex: 1; padding: 10px 14px; border: none; border-radius: 20px; background: #2a3942; color: white; outline: none; }

    /* Modal */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 100; align-items: center; justify-content: center; }
    .modal-card { background: #202c33; padding: 20px; border-radius: 10px; width: 320px; }
  </style>
</head>
<body>

  <!-- 1. AUTH SCREEN -->
  <div id="auth-screen">
    <h2 style="color: #00a884; margin-bottom: 5px;">MyChatApp</h2>
    <p style="font-size: 13px; color: #8696a0; margin-bottom: 15px;">Encrypted Private Network</p>

    <div id="login-fields">
      <input type="tel" id="login-num" class="input-box" placeholder="Mobile Number">
      <input type="password" id="login-pin" class="input-box" placeholder="Your Confidential PIN">
      <button class="btn-green" onclick="doLogin()">Log In</button>
      <button class="btn-outline" onclick="showSignupFlow()">Naya Account Banayein (Sign Up)</button>
    </div>

    <div id="signup-fields" style="display: none;">
      <input type="tel" id="reg-num" class="input-box" placeholder="10-Digit Mobile Number">
      <button class="btn-green" id="otp-btn" onclick="requestOTP()">OTP Bhejein</button>
      
      <div id="verify-box" style="display: none; margin-top: 10px;">
        <input type="text" id="reg-otp" class="input-box" placeholder="4-Digit OTP Dalein">
        <input type="password" id="reg-pin" class="input-box" placeholder="Manchaha Secret PIN Set Karein">
        <button class="btn-green" onclick="completeRegistration()">Register & Start Chat</button>
      </div>
      <button class="btn-outline" onclick="showLoginFlow()">Back to Login</button>
    </div>
    <div id="auth-msg" style="color: #f15c6d; font-size: 13px; margin-top: 10px; text-align: center;"></div>
  </div>

  <!-- 2. MAIN APP DASHBOARD -->
  <div id="main-app">
    <div class="top-nav">
      <div class="user-tag" onclick="openProfileSettings()">
        <img id="my-avatar" class="my-dp" src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='18' font-size='18'>👤</text></svg>">
        <div>
          <h4 id="my-display-number" style="font-size: 15px;">User</h4>
          <span style="font-size: 11px; color: #00a884;">Settings / DP</span>
        </div>
      </div>
      <button onclick="doLogout()" style="background:transparent; border:none; color:#f15c6d; cursor:pointer;">Logout 🚪</button>
    </div>

    <!-- Contacts / Recent Chat List -->
    <div class="chats-container" id="contact-list"></div>

    <button class="fab-btn" onclick="openAddContact()">💬</button>
  </div>

  <!-- 3. CHAT ROOM (Strictly 1-to-1 & Confidential) -->
  <div id="chat-panel">
    <div class="chat-header">
      <div style="display: flex; align-items: center; gap: 10px;">
        <button onclick="closeChat()" style="background:transparent; border:none; color:white; font-size: 20px;">⬅</button>
        <h4 id="active-chat-user">User</h4>
      </div>
      <div>
        <label for="bg-picker" style="cursor: pointer; font-size: 20px;">🎨</label>
        <input type="color" id="bg-picker" style="display:none;" onchange="changeWallpaper(this.value)">
      </div>
    </div>

    <div class="messages-area" id="msg-stream"></div>

    <div class="footer-bar">
      <label for="media-sender" style="cursor: pointer; font-size: 20px;">📎</label>
      <input type="file" id="media-sender" style="display:none;" onchange="sendCurrentMessage()">
      <input type="text" id="chat-box" placeholder="Type confidential message..." onkeydown="if(event.key==='Enter') sendCurrentMessage()">
      <button onclick="sendCurrentMessage()" style="background: #00a884; border:none; color:white; border-radius:50%; width:36px; height:36px; cursor:pointer;">➤</button>
    </div>
  </div>

  <!-- MODAL: ADD NUMBER / START NEW CHAT -->
  <div class="modal" id="contact-modal">
    <div class="modal-card">
      <h3 style="margin-bottom: 10px;">New Chat</h3>
      <input type="tel" id="new-contact-num" class="input-box" placeholder="Enter Mobile Number">
      <button class="btn-green" onclick="confirmAddContact()">Open Chat</button>
      <button class="btn-outline" onclick="document.getElementById('contact-modal').style.display='none'">Cancel</button>
    </div>
  </div>

  <!-- MODAL: PROFILE & DP SETTINGS -->
  <div class="modal" id="profile-modal">
    <div class="modal-card">
      <h3 style="margin-bottom: 12px;">Profile Settings</h3>
      <label style="font-size: 13px; color: #8696a0;">Change Profile Picture (DP):</label>
      <input type="file" id="dp-input" accept="image/*" class="input-box">
      <button class="btn-green" onclick="uploadProfileSettings()">Save Settings</button>
      <button class="btn-outline" onclick="document.getElementById('profile-modal').style.display='none'">Close</button>
    </div>
  </div>

  <script>
    let socket = io();
    let currentUser = localStorage.getItem('chat_active_user') || '';
    let currentTarget = '';
    let currentWallpaper = localStorage.getItem('chat_wall') || '#0b141a';

    // Auto login check: Page refresh par wapas logout nahi hoga
    window.onload = function() {
      if (currentUser) {
        launchDashboard();
      }
    };

    function showSignupFlow() {
      document.getElementById('login-fields').style.display = 'none';
      document.getElementById('signup-fields').style.display = 'block';
    }

    function showLoginFlow() {
      document.getElementById('login-fields').style.display = 'block';
      document.getElementById('signup-fields').style.display = 'none';
    }

    async function requestOTP() {
      const mobile = document.getElementById('reg-num').value.trim();
      const res = await fetch('/send_otp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mobile })
      });
      const data = await res.json();
      if (res.ok) {
        alert("Aapka Verification OTP hai: " + data.otp_preview);
        document.getElementById('verify-box').style.display = 'block';
        document.getElementById('otp-btn').style.display = 'none';
      } else {
        document.getElementById('auth-msg').innerText = data.message;
      }
    }

    async function completeRegistration() {
      const mobile = document.getElementById('reg-num').value.trim();
      const otp = document.getElementById('reg-otp').value.trim();
      const pin = document.getElementById('reg-pin').value.trim();

      const res = await fetch('/auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'signup', mobile, otp, pin })
      });
      const data = await res.json();
      if (res.ok) {
        currentUser = mobile;
        localStorage.setItem('chat_active_user', mobile);
        launchDashboard();
      } else {
        document.getElementById('auth-msg').innerText = data.message;
      }
    }

    async function doLogin() {
      const mobile = document.getElementById('login-num').value.trim();
      const pin = document.getElementById('login-pin').value.trim();

      const res = await fetch('/auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'login', mobile, pin })
      });
      const data = await res.json();
      if (res.ok) {
        currentUser = mobile;
        localStorage.setItem('chat_active_user', mobile);
        if (data.wallpaper) currentWallpaper = data.wallpaper;
        launchDashboard();
      } else {
        document.getElementById('auth-msg').innerText = data.message;
      }
    }

    function doLogout() {
      localStorage.removeItem('chat_active_user');
      location.reload();
    }

    function launchDashboard() {
      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('main-app').style.display = 'flex';
      document.getElementById('my-display-number').innerText = currentUser;
      loadContacts();
      listenSockets();
    }

    async function loadContacts() {
      const res = await fetch(`/my_contacts?user=${currentUser}`);
      const list = await res.json();
      const cont = document.getElementById('contact-list');
      cont.innerHTML = '';

      if (list.length === 0) {
        cont.innerHTML = `<div style="text-align: center; color: #8696a0; margin-top: 50px;">Koi chat nahi hai. Niche 💬 button dabakar naya number jodiye!</div>`;
        return;
      }

      list.forEach(c => {
        const dpSrc = c.avatar || "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='18' font-size='18'>👤</text></svg>";
        cont.innerHTML += `
          <div class="chat-row" onclick="startPrivateChat('${c.mobile}')">
            <img class="chat-dp" src="${dpSrc}">
            <div>
              <h4>${c.mobile}</h4>
              <p style="font-size: 12px; color: #8696a0;">Tap to open confidential chat</p>
            </div>
          </div>`;
      });
    }

    function openAddContact() {
      document.getElementById('contact-modal').style.display = 'flex';
    }

    async function confirmAddContact() {
      const num = document.getElementById('new-contact-num').value.trim();
      if (!num || num === currentUser) return alert("Sahi number dalein!");

      const res = await fetch('/add_contact', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ owner: currentUser, contact: num })
      });
      const data = await res.json();
      if (res.ok) {
        document.getElementById('contact-modal').style.display = 'none';
        loadContacts();
        startPrivateChat(num);
      } else {
        alert(data.message);
      }
    }

    function startPrivateChat(targetNum) {
      currentTarget = targetNum;
      document.getElementById('active-chat-user').innerText = targetNum;
      document.getElementById('chat-panel').style.display = 'flex';
      document.getElementById('msg-stream').style.backgroundColor = currentWallpaper;
      loadMessages();
    }

    function closeChat() {
      document.getElementById('chat-panel').style.display = 'none';
    }

    async function loadMessages() {
      const res = await fetch(`/messages?target=${currentTarget}&user=${currentUser}`);
      const list = await res.json();
      const stream = document.getElementById('msg-stream');
      stream.innerHTML = '';

      list.forEach(m => {
        const isMine = m.sender === currentUser;
        const bubble = isMine ? 'outgoing' : 'incoming';

        if (m.is_deleted === 1) {
          stream.innerHTML += `<div class="bubble ${bubble}" style="font-style:italic; opacity:0.6;">🚫 Message deleted</div>`;
          return;
        }

        let media = '';
        if (m.file_url) {
          if (m.file_type === 'image') media = `<img src="${m.file_url}" style="max-width:220px; border-radius:8px; display:block; margin-top:5px;">`;
          else if (m.file_type === 'video') media = `<video src="${m.file_url}" controls style="max-width:220px;"></video>`;
          else media = `<audio src="${m.file_url}" controls></audio>`;
        }

        const delBtn = isMine ? `<span onclick="deleteEveryone(${m.id})" style="cursor:pointer; margin-left:8px; opacity:0.7;">🗑️</span>` : '';

        stream.innerHTML += `
          <div class="bubble ${bubble}">
            <div style="font-size:11px; opacity:0.7; margin-bottom:2px;">${isMine ? 'You' : m.sender} ${delBtn}</div>
            ${m.text ? `<div>${m.text}</div>` : ''}
            ${media}
          </div>`;
      });
      stream.scrollTop = stream.scrollHeight;
    }

    async function sendCurrentMessage() {
      const box = document.getElementById('chat-box');
      const fileInp = document.getElementById('media-sender');
      const text = box.value.trim();
      const file = fileInp.files[0];

      if (!text && !file) return;

      const fd = new FormData();
      fd.append('sender', currentUser);
      fd.append('target', currentTarget);
      fd.append('text', text);
      if (file) fd.append('file', file);

      box.value = '';
      fileInp.value = '';
      await fetch('/send', { method: 'POST', body: fd });
      loadMessages();
    }

    async function deleteEveryone(id) {
      if (!confirm("Delete for Everyone?")) return;
      await fetch(`/delete_for_everyone/${id}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sender: currentUser })
      });
      loadMessages();
    }

    function changeWallpaper(color) {
      currentWallpaper = color;
      document.getElementById('msg-stream').style.backgroundColor = color;
      localStorage.setItem('chat_wall', color);
      const fd = new FormData();
      fd.append('mobile', currentUser);
      fd.append('wallpaper', color);
      fetch('/update_profile', { method: 'POST', body: fd });
    }

    function openProfileSettings() {
      document.getElementById('profile-modal').style.display = 'flex';
    }

    async function uploadProfileSettings() {
      const dpFile = document.getElementById('dp-input').files[0];
      if (dpFile) {
        const fd = new FormData();
        fd.append('mobile', currentUser);
        fd.append('dp', dpFile);
        await fetch('/update_profile', { method: 'POST', body: fd });
        alert("DP successfully update ho gayi!");
        location.reload();
      }
      document.getElementById('profile-modal').style.display = 'none';
    }

    function listenSockets() {
      socket.on('new_message', (m) => {
        if ((m.sender === currentTarget && m.target === currentUser) || (m.sender === currentUser && m.target === currentTarget)) {
          loadMessages();
        }
      });
      socket.on('message_deleted', () => loadMessages());
    }
  </script>
</body>
</html>
